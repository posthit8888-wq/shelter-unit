<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shelter Unit Leaderboard</title>
    <style>
        body { font-family: sans-serif; padding: 20px; text-align: center; }
        #leaderboard { margin-top: 20px; border: 1px solid #ccc; padding: 20px; display: inline-block; text-align: left; }
        ul { list-style: none; padding: 0; }
        li { padding: 5px 0; border-bottom: 1px solid #eee; }
    </style>
</head>
<body>

    <h1>🏆 게임 리더보드</h1>
    <div id="leaderboard">데이터를 불러오는 중...</div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-database.js";

        // 1. Firebase 연결 정보
        const firebaseConfig = {
            apiKey: "mnpyMgAWZAYAV48AmZAH0YIFqxqRYOw6",
            authDomain: "shelter-unit.firebaseapp.com",
            databaseURL: "https://shelter-unit-default-rtdb.firebaseio.com/",
            projectId: "shelter-unit",
            storageBucket: "shelter-unit.appspot.com",
            messagingSenderId: "664482632720",
            appId: "1:664482632720:web:70e35cc87de477af02a695"
        };

        // 2. Firebase 시작
        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);

        // 3. 점수 가져와서 화면에 뿌리기
        const scoreRef = ref(database, 'scores');
        onValue(scoreRef, (snapshot) => {
            const data = snapshot.val();
            const div = document.getElementById('leaderboard');
            
            if (data) {
                let html = '<ul>';
                for (let key in data) {
                    html += `<li>${data[key].name} : ${data[key].score}점</li>`;
                }
                html += '</ul>';
                div.innerHTML = html;
            } else {
                div.innerHTML = '등록된 점수가 없습니다.';
            }
        });
    </script>
</body>
</html>
