<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
    import { getDatabase, ref, push, onChildAdded } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAzEjnXzlahG1ZREB124qTviWGxHgK1_34",
        authDomain: "shelter-unit.firebaseapp.com",
        databaseURL: "https://shelter-unit-default-rtdb.firebaseio.com",
        projectId: "shelter-unit",
        storageBucket: "shelter-unit.firebasestorage.app",
        messagingSenderId: "664482632720",
        appId: "1:664482632720:web:70e35cc87de477af02a695",
        measurementId: "G-F765PMNPZE"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // 1. 메시지 보내기 함수
    window.sendChatMessage = function() {
        const input = document.getElementById('chat-input');
        const text = input.value.trim();
        if (!text) return;

        push(ref(db, 'chat'), {
            username: "사용자", 
            text: text,
            timestamp: Date.now()
        });
        input.value = '';
    };

    // 2. 메시지 실시간 불러오기
    onChildAdded(ref(db, 'chat'), (snapshot) => {
        const data = snapshot.val();
        const chatBox = document.getElementById('chat-box');
        if (chatBox) {
            const msgDiv = document.createElement('div');
            msgDiv.innerHTML = `<strong>${data.username}:</strong> ${data.text}`;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    });
</script>

                </div>
            </div>

            <button onclick="showInfo()" class="btn btn-game">게임 설명</button>
        </div>
    </div>

    <script>
        let currentUser = null;
        let currentTab = 'game';

        function updateSiteVisitCount() {
            let visits = localStorage.getItem('site_visit_count');
            if (!visits) {
                visits = 1;
            } else {
                visits = parseInt(visits) + 1;
            }
            localStorage.setItem('site_visit_count', visits);
            return visits;
        }

        const space = document.getElementById('space');
        const starCount = 40;
        for (let i = 0; i < starCount; i++) {
            const star = document.createElement('div');
            star.classList.add('star');
            const size = Math.random() * 3 + 1;
            star.style.width = `${size}px`;
            star.style.height = `${size}px`;
            star.style.left = `${Math.random() * 100}vw`;
            const duration = Math.random() * 5 + 4;
            star.style.animationDuration = `${duration}s`;
            const delay = Math.random() * 5;
            star.style.animationDelay = `-${delay}s`;
            space.appendChild(star);
        }

        function showInfo() { alert('테스트'); }
        
        function openDevModal(type) {
            const overlay = document.getElementById('dev-modal-overlay');
            const modalContent = document.getElementById('dev-modal-content');
            const title = document.getElementById('modal-title');
            const body = document.getElementById('modal-body');

            if(type === 'site') {
                modalContent.classList.add('site-style');
                title.innerHTML = '🌐 사이트 개발자 정보';
                body.innerHTML = `dhlwadhw.12 사이트개발자`;
            } else {
                modalContent.classList.remove('site-style');
                title.innerHTML = '🛠️ 개발자 정보';
                body.innerHTML = `dr_heo, KORIA151<br><span style="color:#00ffcc; font-size:0.9rem; font-weight:normal;">공동개발</span>`;
            }

            overlay.style.display = 'flex';
            setTimeout(() => {
                overlay.classList.add('show');
            }, 10);
        }

        function closeDevModal() {
            const overlay = document.getElementById('dev-modal-overlay');
            overlay.classList.remove('show');
            setTimeout(() => {
                overlay.style.display = 'none';
            }, 300);
        }

        function toggleDropdown(event) {
            event.stopPropagation();
            const dropdown = document.getElementById('profile-dropdown');
            dropdown.style.display = dropdown.style.display === 'flex' ? 'none' : 'flex';
        }

        function openChat(event) {
            event.stopPropagation();
            document.getElementById('chat-sidebar').classList.add('open');
            closeLeaderboard();
        }

        function closeChat() {
            document.getElementById('chat-sidebar').classList.remove('open');
        }

        function sendChatMessage() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text || !currentUser) return;

            const chatMessagesContainer = document.getElementById('chat-messages');
            const myAvatar = currentUser.avatar 
                ? `https://cdn.discordapp.com/avatars/${currentUser.id}/${currentUser.avatar}.png`
                : 'https://cdn.discordapp.com/embed/avatars/0.png';

            const msgWrapper = document.createElement('div');
            msgWrapper.className = 'msg-wrapper me';

            msgWrapper.innerHTML = `
                <img src="${myAvatar}" class="msg-avatar">
                <div class="msg-container">
                    <div class="msg-author">${currentUser.username}</div>
                    <div class="msg-bubble">${text}</div>
                </div>
            `;

            chatMessagesContainer.appendChild(msgWrapper);
            input.value = '';
            chatMessagesContainer.scrollTop = chatMessagesContainer.scrollHeight;
        }

        function handleChatKey(event) {
            if (event.key === 'Enter') {
                sendChatMessage();
            }
        }

        window.addEventListener('click', (e) => {
            document.getElementById('profile-dropdown').style.display = 'none';
            const leadSidebar = document.getElementById('leaderboard-sidebar');
            const chatSidebar = document.getElementById('chat-sidebar');
            const profileContainer = document.getElementById('profile-container');
            const chatToggleBtn = document.getElementById('chat-toggle-btn');

            if (!leadSidebar.contains(e.target) && !profileContainer.contains(e.target) && leadSidebar.classList.contains('open')) {
                closeLeaderboard();
            }
            if (!chatSidebar.contains(e.target) && !chatToggleBtn.contains(e.target) && chatSidebar.classList.contains('open')) {
                closeChat();
            }
        });

        function openLeaderboard() {
            document.getElementById('leaderboard-sidebar').classList.add('open');
            closeChat();
            renderLeaderboard();
        }

        function closeLeaderboard() {
            document.getElementById('leaderboard-sidebar').classList.remove('open');
        }

        function switchTab(tabType) {
            currentTab = tabType;
            document.getElementById('rank-list').setAttribute('data-tab', tabType);
            document.getElementById('tab-game').classList.toggle('active', tabType === 'game');
            document.getElementById('tab-site').classList.toggle('active', tabType === 'site');
            renderLeaderboard();
        }

        function renderLeaderboard() {
            const rankListContainer = document.getElementById('rank-list');
            rankListContainer.innerHTML = '';
            if (!currentUser) return;

            const myAvatar = currentUser.avatar 
                ? `https://cdn.discordapp.com/avatars/${currentUser.id}/${currentUser.avatar}.png`
                : 'https://cdn.discordapp.com/embed/avatars/0.png';

            const actualVisits = localStorage.getItem('site_visit_count') || 1;

            const dataPool = [{
                id: currentUser.id,
                username: currentUser.username,
                avatar: myAvatar,
                count: currentTab === 'game' ? 0 : parseInt(actualVisits),
                isMe: true
            }];

            dataPool.forEach((item, index) => {
                const rankItem = document.createElement('div');
                rankItem.className = `rank-item my-rank`;
                rankItem.innerHTML = `
                    <div class="rank-number">1</div>
                    <img src="${item.avatar}" alt="프사" class="rank-avatar">
                    <div class="rank-info">
                        <div class="rank-username">${item.username} (나)</div>
                        <div class="rank-count">${currentTab === 'game' ? '🎮 게임 입장: ' : '🌐 사이트 방문: '}${item.count}회</div>
                    </div>
                `;
                rankListContainer.appendChild(rankItem);
            });
        }

        function logout() {
            localStorage.removeItem('stored_discord_token');
            localStorage.removeItem('stored_discord_user');
            alert('로그아웃 되었습니다.');
            window.location.href = "/";
        }

        function fetchDiscordUserInfo(token) {
            fetch('https://discord.com/api/users/@me', {
                headers: { Authorization: `Bearer ${token}` }
            })
            .then(res => res.json())
            .then(user => {
                if (user.username) {
                    currentUser = user;
                    localStorage.setItem('stored_discord_user', JSON.stringify(user));
                    renderProfileUI(user);
                }
            })
            .catch(err => {
                console.error(err);
                logout();
            });
        }

        function renderProfileUI(user) {
            currentUser = user;
            document.getElementById('login-section').style.display = 'none';
            document.getElementById('dev-wrapper-box').style.display = 'block';
            document.getElementById('chat-toggle-btn').style.display = 'flex';

            const avatarUrl = user.avatar 
                ? `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.png`
                : 'https://cdn.discordapp.com/embed/avatars/0.png';
                
            document.getElementById('profile-img').src = avatarUrl;
            document.getElementById('profile-name').innerText = user.username;
            document.getElementById('profile-container').style.display = 'block';
        }

        window.addEventListener('DOMContentLoaded', () => {
            updateSiteVisitCount();
            const hash = window.location.hash;
            
            if (hash.includes('access_token')) {
                const params = new URLSearchParams(hash.replace('#', '?'));
                const token = params.get('access_token');
                if (token) {
                    localStorage.setItem('stored_discord_token', token);
                    fetchDiscordUserInfo(token);
                    window.history.replaceState({}, document.title, "/");
                    return;
                }
            }

            const savedToken = localStorage.getItem('stored_discord_token');
            const savedUser = localStorage.getItem('stored_discord_user');

            if (savedToken && savedUser) {
                currentUser = JSON.stringify(savedUser).startsWith('{') ? JSON.parse(savedUser) : savedUser;
                renderProfileUI(currentUser);
                fetchDiscordUserInfo(savedToken);
            } else {
                document.getElementById('login-section').style.display = 'flex';
                document.getElementById('dev-wrapper-box').style.display = 'none';
                document.getElementById('profile-container').style.display = 'none';
                document.getElementById('chat-toggle-btn').style.display = 'none';
            }
        });
    </script>
</body>
</html>
</html>
